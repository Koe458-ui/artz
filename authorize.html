<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signing you in — DigiArtz</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="origin">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1A1A1F">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" sizes="any">
<link rel="icon" href="/favicon.ico?v=4" sizes="16x16 32x32 48x48">
<style>
  :root{
    --bg:#1A1A1F; --tx:#F3F3F8; --txd:rgba(216,216,228,.80);
    --danger:#FCA5A5;
    --fb:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.5rem;
    background:var(--bg);
    color:var(--tx);
    font-family:var(--fb);
    -webkit-font-smoothing:antialiased;
  }
  .hoCard{width:min(22rem,100%);text-align:center;}
  .hoWord{margin:0;font-size:1.0625rem;font-weight:600;}
  .hoNote{margin:.5rem 0 0;font-size:.8125rem;line-height:1.5;color:var(--txd);}
  .hoNote.hoBad{color:var(--danger);}
  .hoBack{
    display:inline-block;
    margin-top:1.25rem;
    color:var(--txd);
    font-size:.8125rem;
    text-decoration:underline;
  }
  .hoBack:hover{color:var(--tx);}
</style>
</head>
<body>

<main class="hoCard">
  <p class="hoWord" id="hoWord">Signing you in…</p>
  <p class="hoNote" id="hoNote" role="status">One moment.</p>
  <a class="hoBack" id="hoBack" href="/" hidden>Back to DigiArtz</a>
</main>

<script defer src="/js/vendor/supabase-js-2.112.2.min.js"></script>
<script defer src="/config.js"></script>
<script defer src="/js/authorize.js?v=1"></script>

</body>
</html>

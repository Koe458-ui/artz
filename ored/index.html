<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ored</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" sizes="any">
<link rel="icon" href="/favicon.ico?v=4" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4">
<link rel="stylesheet" href="/ored/app.css?v=1">
</head>
<body>

<header class="oBar">
  <a class="oMark" href="/ored/">Ored.</a>
  <div class="oBarActs">
    <button type="button" class="oCirc" id="oNew" aria-label="New chat" title="New chat">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
    </button>
    <button type="button" class="oCirc" id="oMenu" aria-label="Chat history" title="Chat history"
            aria-expanded="false" aria-controls="oHistory">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 8h16M4 16h16"></path>
      </svg>
    </button>
  </div>
</header>

<main class="oMain" id="oMain">
  <div class="oThread" id="oThread" aria-live="polite"></div>
</main>

<div class="oDock" id="oDock">
  <form class="oComposer" id="oForm" autocomplete="off">
    <label class="oSrOnly" for="oInput">Message Ored</label>
    <textarea id="oInput" rows="1" maxlength="4000" placeholder="Ask Ored"
              enterkeyhint="send" spellcheck="true"></textarea>
    <button type="submit" class="oCirc oSend" id="oSend" aria-label="Send message" title="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 19V5M5 12l7-7 7 7"></path>
      </svg>
    </button>
  </form>
  <p class="oNote" id="oNote" role="status"></p>
</div>

<div class="oScrim" id="oScrim" hidden></div>

<aside class="oHistory" id="oHistory" aria-label="Chat history" hidden>
  <div class="oHistoryBar">
    <span class="oHistoryTitle">History</span>
    <button type="button" class="oCirc oCircSm" id="oHistoryClose" aria-label="Close history">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </button>
  </div>
  <ul class="oHistoryList" id="oHistoryList"></ul>
  <p class="oHistoryEmpty" id="oHistoryEmpty">No conversations yet.</p>
</aside>

<script defer src="/js/vendor/supabase-js-2.112.2.min.js"></script>
<script defer src="/config.js"></script>
<script defer src="/ored/app.js?v=1"></script>

</body>
</html>

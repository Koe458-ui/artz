  - id: "00151"
    category: physics
    question: "What is mass?"
    answer: "Mass is a measure of an object's inertia and amount of matter."

  - id: "00152"
    category: physics
    question: "What is displacement?"
    answer: "Displacement is the change in position of an object with direction."

  - id: "00153"
    category: physics
    question: "What is distance?"
    answer: "Distance is the total length of the path traveled by an object."

  - id: "00154"
    category: physics
    question: "What is average speed?"
    answer: "Average speed is total distance divided by total time."

  - id: "00155"
    category: physics
    question: "What is average velocity?"
    answer: "Average velocity is displacement divided by the elapsed time."

  - id: "00156"
    category: physics
    question: "What is inertia?"
    answer: "Inertia is the tendency of an object to resist changes in its state of motion."

  - id: "00157"
    category: physics
    question: "What is gravity?"
    answer: "Gravity is the interaction that causes masses to attract one another."

  - id: "00158"
    category: physics
    question: "What is weight?"
    answer: "Weight is the gravitational force acting on an object."

  - id: "00159"
    category: physics
    question: "What is friction?"
    answer: "Friction is a force that opposes relative motion or attempted motion between surfaces."

  - id: "00160"
    category: physics
    question: "What is mechanical equilibrium?"
    answer: "Mechanical equilibrium occurs when the net force and net torque on a system are zero."

  - id: "00161"
    category: physics
    question: "What is a scalar quantity?"
    answer: "A scalar quantity has magnitude but no direction."

  - id: "00162"
    category: physics
    question: "What is a vector quantity?"
    answer: "A vector quantity has both magnitude and direction."

  - id: "00163"
    category: physics
    question: "What is Newton's first law?"
    answer: "An object remains at rest or in uniform straight-line motion unless acted on by a net external force."

  - id: "00164"
    category: physics
    question: "What is Newton's second law?"
    answer: "The net force on an object equals its mass multiplied by its acceleration."

  - id: "00165"
    category: physics
    question: "What is Newton's third law?"
    answer: "Forces between interacting bodies occur in equal-magnitude and opposite-direction pairs."

  - id: "00166"
    category: physics
    question: "What is the law of conservation of energy?"
    answer: "Energy cannot be created or destroyed in an isolated system, although it can change form."

  - id: "00167"
    category: physics
    question: "What is mechanical work?"
    answer: "Mechanical work is energy transferred when a force causes displacement."

  - id: "00168"
    category: physics
    question: "What is thermal energy?"
    answer: "Thermal energy is energy associated with microscopic motion and interactions within matter."

  - id: "00169"
    category: physics
    question: "What is heat?"
    answer: "Heat is energy transferred because of a temperature difference."

  - id: "00170"
    category: physics
    question: "What is thermal equilibrium?"
    answer: "Thermal equilibrium occurs when systems in contact have no net heat transfer between them."


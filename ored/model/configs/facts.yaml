    category: biology
    question: "What is a cell membrane?"
    answer: "A cell membrane is a selectively permeable boundary surrounding a cell."

  - id: "00192"
    category: biology
    question: "What is cytoplasm?"
    answer: "Cytoplasm is the material inside a cell outside the nucleus in the usual eukaryotic description."

  - id: "00193"
    category: biology
    question: "What is a tissue?"
    answer: "A tissue is an organized group of similar cells performing related functions."

  - id: "00194"

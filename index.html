<body>

<header class="oBar">
  <a class="oMark" href="/">Ored.</a>
  <div class="oBarActs">
    <button type="button" class="oCirc" id="oNew" aria-label="New chat" title="New chat">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
    </button>
    <button type="button" class="oCirc" id="oMenu" aria-label="Chat history" title="Chat history"
            aria-expanded="false" aria-controls="oHistory">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 8h16M4 16h16"></path>
      </svg>
    </button>
    <button type="button" class="oCirc" id="oOut" aria-label="Sign out" title="Sign out">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M15 17l5-5-5-5M20 12H9M13 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h7"></path>
      </svg>
    </button>
  </div>
</header>

<main class="oMain" id="oMain">
  <div class="oThread" id="oThread" aria-live="polite"></div>
</main>

<div class="oDock" id="oDock">
  <section class="oHero" id="oHero">
    <h1 class="oHeroHead">Ask <em>anything</em></h1>
    <p class="oHeroSub">Ored is DigiArtz's own AI model, built for simple tasks and problem solving.</p>
  </section>
  <form class="oComposer" id="oForm" autocomplete="off">
    <label class="oSrOnly" for="oInput">Message Ored</label>
    <textarea id="oInput" rows="1" maxlength="4000" placeholder="Ask Ored"
              enterkeyhint="send" spellcheck="true"></textarea>
    <button type="submit" class="oCirc oSend" id="oSend" aria-label="Send message" title="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 19V5M5 12l7-7 7 7"></path>
      </svg>
    </button>
  </form>
  <div class="oSeeds" id="oSeeds">
    <button type="button" class="oSeed">Say hello</button>
    <button type="button" class="oSeed">What can you do?</button>
    <button type="button" class="oSeed">What is DigiArtz?</button>
    <button type="button" class="oSeed">Add 9 and 6</button>
  </div>
  <p class="oNote" id="oNote" role="status"></p>
</div>

<section class="oAuth" id="oAuth" hidden aria-labelledby="oAuthTitle">
  <form class="oAuthCard" id="oAuthForm" autocomplete="on">
    <h2 class="oAuthTitle" id="oAuthTitle">Sign in to Ored</h2>
    <p class="oAuthLede" id="oAuthLede">Use your DigiArtz account — one account, both sites.</p>

    <div class="oSocial">
      <button type="button" class="oSocialBtn" data-provider="google" aria-label="Continue with Google">
        <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 6.1 29.5 4 24 4c-7.6 0-14.1 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 34.9 26.8 36 24 36c-5.3 0-9.7-3.6-11.3-8.4l-6.5 5C9.8 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.3 5.3C40.9 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Google
      </button>
      <button type="button" class="oSocialBtn" data-provider="discord" aria-label="Continue with Discord">
        <svg viewBox="0 0 24 24" fill="#5865F2" aria-hidden="true" focusable="false"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037 19.736 19.736 0 0 0-4.885 1.515.07.07 0 0 0-.032.027C.533 9.045-.32 13.579.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.211 0 2.176 1.094 2.157 2.418 0 1.334-.946 2.419-2.157 2.419zm7.974 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.211 0 2.176 1.094 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
        Discord
      </button>
      <button type="button" class="oSocialBtn" data-provider="apple" aria-label="Continue with Apple">
        <svg viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true" focusable="false"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.67.91-1.377 0-2.335-1.25-3.4-2.79-1.23-1.75-2.24-4.53-2.24-7.17 0-4.22 2.74-6.46 5.44-6.46 1.398 0 2.598.94 3.5.94.86 0 2.187-1 3.83-1 .61 0 2.905.06 4.394 2.19-.108.07-2.617 1.53-2.617 4.62 0 3.62 3.14 4.9 3.34 4.99z"/></svg>
        Apple
      </button>
    </div>

    <p class="oOr" aria-hidden="true">or</p>

    <label class="oSrOnly" for="oEmail">Email</label>
    <input class="oField" id="oEmail" type="email" name="email" placeholder="Email"
           autocomplete="email" required>
    <label class="oSrOnly" for="oPass">Password</label>
    <input class="oField" id="oPass" type="password" name="password" placeholder="Password"
           autocomplete="current-password" minlength="8" required>
    <button type="submit" class="oBtn" id="oAuthGo">Sign in</button>
    <p class="oAuthNote" id="oAuthNote" role="status"></p>
    <a class="oLink" id="oAuthJoin" href="https://digiartz.net/login"
       target="_blank" rel="noopener">No account yet? Create one on DigiArtz</a>
  </form>
</section>

<div class="oScrim" id="oScrim" hidden></div>

<aside class="oHistory" id="oHistory" aria-label="Chat history" hidden>
  <div class="oHistoryBar">
    <span class="oHistoryTitle">History</span>
    <button type="button" class="oCirc oCircSm" id="oHistoryClose" aria-label="Close history">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </button>
  </div>
  <ul class="oHistoryList" id="oHistoryList"></ul>
  <p class="oHistoryEmpty" id="oHistoryEmpty">No conversations yet.</p>
</aside>

<script defer src="/js/vendor/supabase-js-2.112.2.min.js"></script>
<script defer src="/config.js?v=2"></script>
<script defer src="/app.js?v=4"></script>

</body>
</html>
